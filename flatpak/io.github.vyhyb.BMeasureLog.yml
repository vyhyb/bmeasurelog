app-id: io.github.vyhyb.BMeasureLog
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: bmeasurelog

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # BlueZ access for BLE scanning and connecting
  - --system-talk-name=org.bluez

modules:
  - python3-bleak.json

  - name: bmeasurelog
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps --no-index --no-build-isolation --no-cache-dir .
      - install -Dm644 flatpak/io.github.vyhyb.BMeasureLog.desktop -t /app/share/applications
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.vyhyb.BMeasureLog.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 flatpak/io.github.vyhyb.BMeasureLog.metainfo.xml -t /app/share/metainfo
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .venv
          - build-dir
          - .flatpak-builder

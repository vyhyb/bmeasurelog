name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  flatpak:
    name: flatpak ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: bmeasurelog-${{ matrix.arch }}.flatpak
          manifest-path: flatpak/io.github.vyhyb.BMeasureLog.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.sha }}
          upload-artifact: false

      - uses: actions/upload-artifact@v6
        with:
          name: flatpak-${{ matrix.arch }}
          path: bmeasurelog-${{ matrix.arch }}.flatpak

  release:
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
